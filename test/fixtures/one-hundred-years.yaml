  - type: text
    id: title
    x: 220
    y: 0
    text: "百年孤独 · 布恩迪亚家族关系图"
    fontSize: 22
    strokeColor: "#343a40"

  # === Gen 1 ===
  - type: rectangle
    id: jose_b
    x: 200
    y: 70
    width: 250
    height: 65
    backgroundColor: "#a5d8ff"
    fillStyle: solid
    strokeColor: "#1971c2"
    label:
      text: "José Arcadio Buendía"
      fontSize: 16

  - type: rectangle
    id: ursula
    x: 530
    y: 70
    width: 210
    height: 65
    backgroundColor: "#fcc2d7"
    fillStyle: solid
    strokeColor: "#c2255c"
    label:
      text: "Úrsula Iguarán"
      fontSize: 16

  # Gen 1 couple connector (arrow with no arrowheads = line with label support)
  - type: arrow
    id: couple1
    x: 401
    y: 102
    points: [[0, 0], [127, 0]]
    strokeColor: "#e03131"
    strokeWidth: 3
    startArrowhead: null
