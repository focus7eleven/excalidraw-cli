meta:
  title: Excalidraw CLI Architecture
  theme: light
  background: "#ffffff"

elements:
  # === Row 1: Input Sources (centered, evenly spaced) ===
  - type: rectangle
    id: json
    x: 80
    y: 30
    width: 110
    height: 55
    backgroundColor: "#ffd8a8"
    fillStyle: solid
    label:
      text: ".json"

  - type: rectangle
    id: yaml
    x: 220
    y: 30
    width: 110
    height: 55
    backgroundColor: "#ffd8a8"
    fillStyle: solid
    label:
      text: ".yaml"

  - type: rectangle
    id: excalidraw
    x: 360
    y: 30
    width: 150
    height: 55
    backgroundColor: "#ffd8a8"
    fillStyle: solid
    label:
      text: ".excalidraw"

  # === Row 2: CLI ===
  - type: rectangle
    id: cli
    x: 130
    y: 140
    width: 310
    height: 55
    backgroundColor: "#d0bfff"
    fillStyle: solid
    label:
      text: "CLI (Commander.js)"

  # === Row 3: Input Loader ===
  - type: rectangle
    id: loader
    x: 130
    y: 250
    width: 310
    height: 55
    backgroundColor: "#a5d8ff"
    fillStyle: solid
    label:
      text: "Input Loader + Zod"

  # === Row 4: Transform ===
  - type: rectangle
    id: transform
    x: 130
    y: 360
    width: 310
    height: 55
    backgroundColor: "#b2f2bb"
    fillStyle: solid
    label:
      text: "Transform (Skeleton)"

  # === Row 5: SVG Renderer ===
  - type: rectangle
    id: svgrender
    x: 130
    y: 470
    width: 310
    height: 55
    backgroundColor: "#99e9f2"
    fillStyle: solid
    label:
      text: "exportToSvg + jsdom"

  # === Side: Font System ===
  - type: rectangle
    id: fonts
    x: 540
    y: 360
    width: 150
    height: 55
    backgroundColor: "#fcc2d7"
    fillStyle: solid
    label:
      text: "Fonts (.ttf)"
      fontSize: 16

  # === Row 6: Export engines side by side ===
  - type: rectangle
    id: resvg
    x: 100
    y: 590
    width: 170
    height: 55
    backgroundColor: "#ffec99"
    fillStyle: solid
    label:
      text: "resvg-js"

  - type: rectangle
    id: puppeteer
    x: 310
    y: 590
    width: 170
    height: 55
    backgroundColor: "#ffec99"
    fillStyle: solid
    label:
      text: "Puppeteer"

  # === Row 7: Outputs ===
  - type: rectangle
    id: svgout
    x: 145
    y: 700
    width: 100
    height: 50
    backgroundColor: "#c3fae8"
    fillStyle: solid
    label:
      text: ".svg"

  - type: rectangle
    id: pngout
    x: 340
    y: 700
    width: 100
    height: 50
    backgroundColor: "#c3fae8"
    fillStyle: solid
    label:
      text: ".png"

  # === Vertical flow arrows ===
  - type: arrow
    id: a1
    start: { id: json }
    end: { id: cli }

  - type: arrow
    id: a2
    start: { id: yaml }
    end: { id: cli }

  - type: arrow
    id: a3
    start: { id: excalidraw }
    end: { id: cli }

  - type: arrow
    id: a4
    start: { id: cli }
    end: { id: loader }

  - type: arrow
    id: a5
    start: { id: loader }
    end: { id: transform }

  - type: arrow
    id: a6
    start: { id: transform }
    end: { id: svgrender }

  # Font system arrow (horizontal, from right)
  - type: arrow
    id: a_fonts
    start: { id: fonts }
    end: { id: svgrender }

  # SVG renderer to outputs
  - type: arrow
    id: a7
    start: { id: svgrender }
    end: { id: svgout }

  - type: arrow
    id: a8
    start: { id: svgrender }
    end: { id: resvg }

  - type: arrow
    id: a9
    start: { id: svgrender }
    end: { id: puppeteer }

  - type: arrow
    id: a10
    start: { id: resvg }
    end: { id: pngout }

  - type: arrow
    id: a11
    start: { id: puppeteer }
    end: { id: pngout }
