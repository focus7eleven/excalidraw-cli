meta:
  title: Architecture Diagram
  theme: light
  background: "#ffffff"

elements:
  - type: rectangle
    id: client
    x: 50
    y: 50
    width: 200
    height: 100
    backgroundColor: "#a5d8ff"
    fillStyle: solid
    label:
      text: Client App

  - type: rectangle
    id: server
    x: 400
    y: 50
    width: 200
    height: 100
    backgroundColor: "#b2f2bb"
    fillStyle: solid
    label:
      text: API Server

  - type: rectangle
    id: db
    x: 750
    y: 50
    width: 200
    height: 100
    backgroundColor: "#ffec99"
    fillStyle: solid
    label:
      text: Database

  - type: arrow
    id: arrow1
    x: 250
    y: 100
    label:
      text: HTTP Request
    start:
      id: client
    end:
      id: server

  - type: arrow
    id: arrow2
    x: 600
    y: 100
    label:
      text: SQL Query
    start:
      id: server
    end:
      id: db

  - type: text
    id: title
    x: 350
    y: 200
    text: "System Architecture"
    fontSize: 28
